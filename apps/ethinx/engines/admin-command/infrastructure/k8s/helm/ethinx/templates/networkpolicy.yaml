{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ethinx.fullname" . }}
  labels:
    {{- include "ethinx.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ethinx.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.service.targetPort }}
          protocol: TCP
{{- end }}
