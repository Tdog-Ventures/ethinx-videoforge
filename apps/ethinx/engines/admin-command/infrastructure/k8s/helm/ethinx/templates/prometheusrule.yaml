{{- if and .Values.monitoring.enabled .Values.monitoring.alerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "ethinx.fullname" . }}
  labels:
    {{- include "ethinx.labels" . | nindent 4 }}
    {{- with .Values.monitoring.alerts.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: ethinx.availability
      rules:
        - alert: EthinxDown
          expr: up{job="{{ include "ethinx.fullname" . }}"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "ETHINX instance is down"
            description: "{{ "{{" }} $labels.instance {{ "}}" }} has been unreachable for 2 minutes."

        - alert: EthinxHighErrorRate
          expr: |
            sum(rate(http_requests_total{job="{{ include "ethinx.fullname" . }}", status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{job="{{ include "ethinx.fullname" . }}"}[5m]))
            > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High error rate on ETHINX"
            description: "Error rate is above 5% for 5 minutes."

        - alert: EthinxHighLatency
          expr: |
            histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job="{{ include "ethinx.fullname" . }}"}[5m])) by (le))
            > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High latency on ETHINX"
            description: "P95 latency exceeds 1 second for 5 minutes."

    - name: ethinx.resources
      rules:
        - alert: EthinxHighMemory
          expr: |
            container_memory_usage_bytes{container="{{ .Chart.Name }}"}
            /
            container_spec_memory_limit_bytes{container="{{ .Chart.Name }}"}
            > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "ETHINX memory usage > 90%"
            description: "Container memory usage is above 90% of limit."

        - alert: EthinxHighCPU
          expr: |
            rate(container_cpu_usage_seconds_total{container="{{ .Chart.Name }}"}[5m])
            /
            container_spec_cpu_quota{container="{{ .Chart.Name }}"}
            * container_spec_cpu_period{container="{{ .Chart.Name }}"}
            > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "ETHINX CPU usage > 85%"
            description: "Container CPU usage above 85% for 10 minutes."

        - alert: EthinxPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{container="{{ .Chart.Name }}"}[1h]) > 3
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "ETHINX pod restarting frequently"
            description: "Pod has restarted more than 3 times in the last hour."

    - name: ethinx.scaling
      rules:
        - alert: EthinxReplicasMismatch
          expr: |
            kube_deployment_spec_replicas{deployment="{{ include "ethinx.fullname" . }}"}
            !=
            kube_deployment_status_ready_replicas{deployment="{{ include "ethinx.fullname" . }}"}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "ETHINX replicas mismatch"
            description: "Desired replicas do not match ready replicas for 5 minutes."
{{- end }}
