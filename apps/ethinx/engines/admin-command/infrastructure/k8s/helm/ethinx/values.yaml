# ETHINX Helm Values

replicaCount: 2

image:
  repository: ethinx/core
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  fsGroup: 101

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: ethinx.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: ethinx-tls
    #   hosts:
    #     - ethinx.example.com

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

env: []
  # - name: VITE_SUPABASE_URL
  #   value: "https://your-project.supabase.co"

envFrom: []
  # - secretRef:
  #     name: ethinx-secrets

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

persistence:
  enabled: false
  size: 1Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce

networkPolicy:
  enabled: false

monitoring:
  enabled: false
  serviceMonitor:
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
  alerts:
    enabled: true
    labels: {}
  grafana:
    enabled: true
